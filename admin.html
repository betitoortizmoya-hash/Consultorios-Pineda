<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultorio Pineda | Panel de Administración</title>
    <link rel="icon" type="image/png" href="favicon.png?v=4">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .modal { transition: opacity 0.3s ease; }
        .bg-pineda-cyan { background-color: #26bad4; }
        .text-pineda-cyan { color: #26bad4; }
        .bg-pineda-navy { background-color: #1b365d; }
        .text-pineda-navy { color: #1b365d; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased flex h-screen overflow-hidden">

    <aside class="w-64 bg-pineda-navy text-white flex flex-col shadow-xl z-20">
        <div class="h-20 flex items-center justify-center border-b border-slate-700 px-6">
            <i class="fa-solid fa-tooth text-[#26bad4] text-2xl mr-3"></i>
            <span class="text-xl font-bold tracking-tight">Consultorio Pineda</span>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="#" class="flex items-center gap-3 px-4 py-3 bg-[#26bad4] text-white rounded-lg font-medium transition-colors shadow-md">
                <i class="fa-solid fa-user-doctor w-5"></i> Gestión de Dentistas
            </a>
        </nav>
        <div class="p-4 border-t border-slate-700">
            <button onclick="window.location.href='index.html'" class="w-full mt-2 flex items-center justify-center gap-2 px-4 py-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors text-sm">
                <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-20 bg-white shadow-sm flex items-center justify-between px-8 z-10">
            <h1 class="text-2xl font-bold text-pineda-navy">Dentistas Registrados (Nube)</h1>
            <button onclick="toggleModal('createUserModal')" class="bg-pineda-cyan hover:bg-[#1fa1b8] text-white px-4 py-2 rounded-lg text-sm font-semibold transition-colors shadow-sm flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> Crear Usuario
            </button>
        </header>

        <div class="flex-1 overflow-y-auto p-8">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-500 text-sm border-b border-slate-200">
                                <th class="px-6 py-4 font-medium">Nombre / Correo</th>
                                <th class="px-6 py-4 font-medium">Especialidad</th>
                                <th class="px-6 py-4 font-medium">Contraseña Asignada</th>
                                <th class="px-6 py-4 font-medium text-right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTabla" class="divide-y divide-slate-100">
                            <tr><td colspan="4" class="text-center py-8 text-slate-500">Conectando con la base de datos...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL: CREAR NUEVO USUARIO -->
    <div id="createUserModal" class="modal hidden fixed inset-0 bg-slate-900 bg-opacity-60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-pineda-navy px-6 py-4 flex justify-between items-center z-10">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-user-plus text-[#26bad4]"></i> Registrar Nuevo Dentista
                </h2>
                <button onclick="toggleModal('createUserModal')" class="text-slate-300 hover:text-white text-2xl leading-none transition-colors">&times;</button>
            </div>
            
            <form id="formNuevoUsuario" onsubmit="registrarUsuario(event)" class="p-6">
                <h3 class="text-sm font-bold text-pineda-cyan uppercase tracking-wider mb-4 border-b border-slate-100 pb-2">Información y Credenciales</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Nombre completo</label>
                        <input type="text" id="inputNombre" required class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Especialidad</label>
                        <select id="inputEspecialidad" required class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none bg-white">
                            <option value="Odontología General">Odontología General</option>
                            <option value="Ortodoncia">Ortodoncia</option>
                            <option value="Endodoncia">Endodoncia</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Correo (Usuario de Acceso)</label>
                        <input type="email" id="inputCorreo" required class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Crear Contraseña Temporal</label>
                        <input type="text" id="inputPassword" required class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none" placeholder="Ej. dentista123">
                    </div>
                </div>

                <h3 class="text-sm font-bold text-pineda-cyan uppercase tracking-wider mb-4 border-b border-slate-100 pb-2">Servicios Iniciales</h3>
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6 space-y-3">
                    <div class="grid grid-cols-12 gap-3 items-center">
                        <div class="col-span-8"><input type="text" id="s1Nombre" required placeholder="Servicio 1 (Ej. Limpieza)" class="w-full px-4 py-2 border rounded-lg"></div>
                        <div class="col-span-4"><input type="number" id="s1Precio" required placeholder="$ Precio" class="w-full px-4 py-2 border rounded-lg"></div>
                    </div>
                    <div class="grid grid-cols-12 gap-3 items-center">
                        <div class="col-span-8"><input type="text" id="s2Nombre" required placeholder="Servicio 2 (Ej. Consulta)" class="w-full px-4 py-2 border rounded-lg"></div>
                        <div class="col-span-4"><input type="number" id="s2Precio" required placeholder="$ Precio" class="w-full px-4 py-2 border rounded-lg"></div>
                    </div>
                </div>

                <div class="flex items-center justify-end gap-3 pt-4">
                    <button type="button" onclick="toggleModal('createUserModal')" class="px-5 py-2.5 text-slate-600 font-medium hover:bg-slate-100 rounded-lg transition-colors">Cancelar</button>
                    <button type="submit" id="btnGuardar" class="px-5 py-2.5 bg-pineda-cyan hover:bg-[#1fa1b8] text-white font-bold rounded-lg transition-colors shadow-md">
                        Guardar Dentista
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- CONEXIÓN CON FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        // Tus credenciales extraídas de tu imagen
        const firebaseConfig = {
            apiKey: "AIzaSyCSvx5Ra5FMtOyfGQCLMUwthGnLXiQE5Ts",
            authDomain: "pineda-consultorios.firebaseapp.com",
            projectId: "pineda-consultorios",
            storageBucket: "pineda-consultorios.firebasestorage.app",
            messagingSenderId: "867106565273",
            appId: "1:867106565273:web:a9d98a7a36b522cbd7dc08"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // FUNCIÓN: Leer dentistas de la base de datos
        async function renderizarTabla() {
            const tbody = document.getElementById('cuerpoTabla');
            tbody.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-slate-500"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Cargando datos...</td></tr>';

            try {
                const querySnapshot = await getDocs(collection(db, "dentistas"));
                tbody.innerHTML = '';
                
                if (querySnapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-slate-500">No hay dentistas registrados.</td></tr>';
                    return;
                }

                querySnapshot.forEach((documento) => {
                    const dentista = documento.data();
                    const fila = document.createElement('tr');
                    fila.className = "hover:bg-slate-50 transition-colors";
                    fila.innerHTML = `
                        <td class="px-6 py-4">
                            <p class="font-bold text-slate-800">${dentista.nombre}</p>
                            <p class="text-sm text-slate-500">${dentista.correo}</p>
                        </td>
                        <td class="px-6 py-4 text-slate-600">${dentista.especialidad}</td>
                        <td class="px-6 py-4 text-slate-600 font-mono text-sm">${dentista.password}</td>
                        <td class="px-6 py-4 text-right space-x-2">
                            <button onclick="eliminarDentista('${documento.id}')" class="text-slate-400 hover:text-red-500 transition-colors" title="Eliminar"><i class="fa-solid fa-ban"></i></button>
                        </td>
                    `;
                    tbody.appendChild(fila);
                });
            } catch (error) {
                console.error("Error al cargar: ", error);
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-red-500">Error al conectar con la base de datos. Verifica que Firestore esté en "Modo Prueba".</td></tr>';
            }
        }

        // Exponer funciones globales para que los botones de HTML las detecten
        window.toggleModal = function(modalID) {
            const modal = document.getElementById(modalID);
            modal.classList.toggle('hidden');
            if (modal.classList.contains('hidden')) document.getElementById('formNuevoUsuario').reset();
        };

        window.registrarUsuario = async function(event) {
            event.preventDefault();
            const btn = document.getElementById('btnGuardar');
            btn.innerText = "Guardando...";
            btn.disabled = true;

            const nuevoDentista = {
                nombre: document.getElementById('inputNombre').value,
                correo: document.getElementById('inputCorreo').value,
                especialidad: document.getElementById('inputEspecialidad').value,
                password: document.getElementById('inputPassword').value,
                servicios: [
                    { id: Date.now(), nombre: document.getElementById('s1Nombre').value, precio: document.getElementById('s1Precio').value, fotos: [] },
                    { id: Date.now() + 1, nombre: document.getElementById('s2Nombre').value, precio: document.getElementById('s2Precio').value, fotos: [] }
                ],
                citas: [],
                solicitudes: [],
                whatsapp: "",
                fotoPerfil: null
            };

            try {
                await addDoc(collection(db, "dentistas"), nuevoDentista);
                await renderizarTabla();
                window.toggleModal('createUserModal');
            } catch (error) {
                console.error("Error al guardar: ", error);
                alert("Error al guardar en la nube. Revisa la consola.");
            }
            
            btn.innerText = "Guardar Dentista";
            btn.disabled = false;
        };

        window.eliminarDentista = async function(id) {
            if(confirm("¿Estás seguro de eliminar este dentista por completo de la nube?")) {
                try {
                    await deleteDoc(doc(db, "dentistas", id));
                    await renderizarTabla();
                } catch (error) {
                    console.error("Error eliminando: ", error);
                }
            }
        };

        // Cargar datos al iniciar
        document.addEventListener('DOMContentLoaded', renderizarTabla);
    </script>
</body>
</html>
