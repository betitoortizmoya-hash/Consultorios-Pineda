<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultorio Pineda | Gestión Dental Profesional</title>
    <link rel="icon" type="image/png" href="favicon.png?v=4">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .modal { transition: opacity 0.3s ease; }
        .bg-pineda-cyan { background-color: #26bad4; }
        .text-pineda-cyan { color: #26bad4; }
        .bg-pineda-navy { background-color: #1b365d; }
        .text-pineda-navy { color: #1b365d; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased">

    <nav class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex-shrink-0 flex items-center gap-2">
                    <img src="image_a55d46.jpg.png" alt="Logo Consultorio Pineda" class="h-14 w-auto object-contain">
                </div>
                <button onclick="toggleModal('loginModal')" class="text-pineda-navy hover:text-pineda-cyan font-semibold px-4 py-2 rounded-md transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-user-lock"></i> Acceso Personal
                </button>
            </div>
        </div>
    </nav>

    <header class="bg-pineda-navy text-white text-center py-16 px-4 border-b-4 border-[#26bad4]">
        <h1 class="text-4xl md:text-5xl font-extrabold mb-4">Consultorio Pineda</h1>
        <p class="text-xl md:text-2xl font-medium text-slate-200 mb-6 italic">"Sonrisas de primera, sin dolor de muela."</p>
        <p class="text-lg md:text-xl text-slate-300 max-w-2xl mx-auto">Selecciona a uno de nuestros profesionales para ver sus servicios y agendar tu cita al instante.</p>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div id="contenedorDentistas" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Tarjetas generadas dinámicamente -->
        </div>
    </main>

    <!-- MODAL DE SERVICIOS PÚBLICOS -->
    <div id="dentistModal" class="modal hidden fixed inset-0 bg-slate-900 bg-opacity-60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-white border-b border-slate-100 px-6 py-4 flex justify-between items-center z-10">
                <h2 id="modalDentistName" class="text-2xl font-bold text-pineda-navy">Nombre Dentista</h2>
                <button onclick="toggleModal('dentistModal')" class="text-slate-400 hover:text-pineda-cyan text-2xl leading-none">&times;</button>
            </div>
            
            <div class="p-6">
                <p id="modalDentistSpec" class="text-pineda-cyan font-medium mb-6">Especialidad</p>
                <h3 class="text-lg font-bold mb-4 text-slate-700">Selecciona un servicio:</h3>
                
                <div class="space-y-4 mb-8" id="listaServiciosModal">
                    <!-- Servicios inyectados aquí -->
                </div>

                <div id="bookingForm" class="hidden bg-cyan-50 p-6 rounded-xl border border-cyan-100 mt-6">
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-slate-600 font-medium">Costo estimado:</span>
                        <span id="servicePrice" class="text-2xl font-bold text-pineda-navy"></span>
                    </div>
                    
                    <form onsubmit="solicitarCita(event)">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Tu Nombre completo</label>
                                <input type="text" id="citaNombre" required class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:border-[#26bad4]">
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">Tu WhatsApp</label>
                                    <input type="tel" id="citaWhatsapp" required class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:border-[#26bad4]">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">Correo electrónico (Opcional)</label>
                                    <input type="email" id="citaCorreo" class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:border-[#26bad4]">
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-pineda-cyan hover:bg-[#1fa1b8] text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-md mt-4">
                                Enviar Solicitud de Cita
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: LOG IN -->
    <div id="loginModal" class="modal hidden fixed inset-0 bg-slate-900 bg-opacity-60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
            <div class="px-6 py-4 flex justify-end">
                <button onclick="toggleModal('loginModal')" class="text-slate-400 hover:text-pineda-cyan text-2xl leading-none">&times;</button>
            </div>
            <div class="px-8 pb-8">
                <div class="text-center mb-8 flex flex-col items-center">
                    <img src="image_a55d46.jpg.png" alt="Logo" class="h-16 mb-4 object-contain">
                    <h2 class="text-2xl font-bold text-pineda-navy">Acceso a Personal</h2>
                </div>
                
                <form onsubmit="validarLogin(event)">
                    <div class="space-y-5">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Usuario / Correo</label>
                            <input type="text" id="username" required class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:border-[#26bad4]" placeholder="Ej. mario.ortiz">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
                            <input type="password" id="password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:border-[#26bad4]">
                        </div>
                        <button type="submit" class="w-full bg-pineda-navy hover:bg-[#122543] text-white font-bold py-3 px-4 rounded-lg shadow-md mt-2">
                            Ingresar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let dentistaSeleccionadoIndex = null;

        function cargarDentistasPublicos() {
            const dentistas = JSON.parse(localStorage.getItem('dentistas_pineda')) || [];
            const contenedor = document.getElementById('contenedorDentistas');
            contenedor.innerHTML = '';

            if (dentistas.length === 0) {
                contenedor.innerHTML = '<p class="text-slate-500 col-span-full text-center">No hay dentistas registrados aún.</p>';
                return;
            }

            dentistas.forEach((dentista, index) => {
                // Diseño limpio: La imagen abarca todo el cuadro de arriba sin márgenes
                let visualPerfil = dentista.fotoPerfil 
                    ? `<img src="${dentista.fotoPerfil}" class="w-full h-64 object-cover object-top group-hover:scale-105 transition-transform duration-300">`
                    : `<div class="w-full h-64 bg-slate-200 flex items-center justify-center"><i class="fa-solid fa-user-doctor text-6xl text-slate-400 group-hover:scale-110 transition-transform duration-300"></i></div>`;

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden hover:shadow-lg transition-shadow cursor-pointer group flex flex-col";
                card.onclick = () => openDentistModal(index);

                card.innerHTML = `
                    <div class="w-full h-64 overflow-hidden relative">
                        ${visualPerfil}
                    </div>
                    <div class="p-6 text-center flex-1">
                        <h3 class="text-xl font-bold text-pineda-navy">${dentista.nombre}</h3>
                        <p class="text-pineda-cyan font-medium mb-4">${dentista.especialidad}</p>
                        <span class="inline-block bg-cyan-50 text-pineda-cyan rounded-full px-4 py-2 text-sm font-semibold border border-cyan-100">Ver servicios y agendar</span>
                    </div>
                `;
                contenedor.appendChild(card);
            });
        }

        function toggleModal(modalID) {
            const modal = document.getElementById(modalID);
            modal.classList.toggle('hidden');
            if (modalID === 'dentistModal' && modal.classList.contains('hidden')) {
                document.getElementById('bookingForm').classList.add('hidden');
            }
            if (modalID === 'loginModal' && modal.classList.contains('hidden')) {
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
            }
        }
        
        function openDentistModal(index) {
            dentistaSeleccionadoIndex = index;
            const dentistas = JSON.parse(localStorage.getItem('dentistas_pineda')) || [];
            const dentista = dentistas[index];
            
            document.getElementById('modalDentistName').innerText = dentista.nombre;
            document.getElementById('modalDentistSpec').innerText = dentista.especialidad;
            
            const listaServicios = document.getElementById('listaServiciosModal');
            listaServicios.innerHTML = '';

            if(!dentista.servicios || dentista.servicios.length === 0) {
                listaServicios.innerHTML = '<p class="text-slate-500">Este profesional aún no ha listado sus servicios.</p>';
            } else {
                dentista.servicios.forEach(serv => {
                    let galeria = '';
                    if(serv.fotos && serv.fotos.length > 0) {
                        galeria = `<div class="flex gap-4 mt-4 overflow-x-auto pb-3 scrollbar-hide w-full">`;
                        serv.fotos.forEach(foto => {
                            galeria += `<img src="${foto}" class="h-32 w-48 rounded-lg object-cover border border-slate-200 shadow-sm flex-shrink-0">`;
                        });
                        galeria += `</div>`;
                    }

                    listaServicios.innerHTML += `
                        <div class="border border-slate-200 rounded-xl p-5 hover:bg-slate-50 transition-colors">
                            <label class="flex justify-between items-center cursor-pointer w-full">
                                <div class="flex items-center gap-3">
                                    <input type="radio" name="servicio" data-nombre="${serv.nombre}" class="w-5 h-5 accent-[#26bad4]" onchange="showForm('${serv.precio}')">
                                    <span class="font-bold text-slate-700 text-lg">${serv.nombre}</span>
                                </div>
                                <span class="text-pineda-navy font-black text-lg">$${serv.precio}</span>
                            </label>
                            ${galeria}
                        </div>
                    `;
                });
            }
            toggleModal('dentistModal');
        }
        
        function showForm(price) {
            document.getElementById('servicePrice').innerText = "$" + price + " MXN";
            document.getElementById('bookingForm').classList.remove('hidden');
            document.getElementById('bookingForm').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function solicitarCita(event) {
            event.preventDefault();
            const nombre = document.getElementById('citaNombre').value;
            const whatsapp = document.getElementById('citaWhatsapp').value;
            const correo = document.getElementById('citaCorreo').value;
            
            const servicioRadio = document.querySelector('input[name="servicio"]:checked');
            if(!servicioRadio) {
                alert("Por favor selecciona un servicio.");
                return;
            }
            const servicioNombre = servicioRadio.getAttribute('data-nombre');

            let dentistas = JSON.parse(localStorage.getItem('dentistas_pineda')) || [];
            let dentista = dentistas[dentistaSeleccionadoIndex];

            // Aseguramos que existan los arrays en la memoria de este doctor
            if(!dentista.solicitudes) dentista.solicitudes = [];
            if(!dentista.citas) dentista.citas = [];

            // Guardamos la solicitud
            dentista.solicitudes.push({
                id: Date.now(),
                paciente: nombre,
                whatsapp: whatsapp,
                correo: correo,
                servicio: servicioNombre,
                fechaCreacion: new Date().toLocaleDateString('es-MX')
            });

            localStorage.setItem('dentistas_pineda', JSON.stringify(dentistas));
            
            alert('¡Solicitud enviada exitosamente! El doctor la verá en su panel para asignarte una fecha.');
            document.getElementById('citaNombre').value = '';
            document.getElementById('citaWhatsapp').value = '';
            document.getElementById('citaCorreo').value = '';
            toggleModal('dentistModal');
        }

        function validarLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;

            if ((user === 'mario.ortiz' && pass === '12345678') || (user === 'kevin.pineda' && pass === '12345678')) {
                window.location.href = 'admin.html';
                return;
            }

            const dentistas = JSON.parse(localStorage.getItem('dentistas_pineda')) || [];
            const dentistaEncontrado = dentistas.find(d => d.correo === user && d.password === pass);

            if (dentistaEncontrado) {
                sessionStorage.setItem('dentistaLogueado', JSON.stringify(dentistaEncontrado));
                window.location.href = 'panel_dentista.html';
            } else {
                alert('Usuario o contraseña incorrectos.');
            }
        }

        document.addEventListener('DOMContentLoaded', cargarDentistasPublicos);
    </script>
</body>
</html>
